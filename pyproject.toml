[project]
name = "car-price-prediction"
version = "1.0.0"
description = "End-to-end used-car price regression: preprocessing, model comparison, tuning, persistence and a Streamlit app."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    # matplotlib/seaborn deprecations in third-party code are not our failures
    "ignore::DeprecationWarning:seaborn.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
